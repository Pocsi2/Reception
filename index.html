<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Espacio - Portfolio Minimal</title>
  <style>
    /* Estilos base */
    body {
      margin: 0;
      padding: 0;
      --paper-color: #ffffff;
      --ink-color: #111111;
      background-color: var(--paper-color);
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      transition: background-color 0.16s ease;
    }
    /* Contenedor principal */
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 2vw;
      box-sizing: border-box;
    }
    /* Barra horizontal con gradiente */
    .horizontal-line {
      position: fixed;
      bottom: 5vh;
      left: 0;
      width: calc(100% - 80px);
      height: 1px;
      background: linear-gradient(to right, 
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0) 75%,
        color-mix(in srgb, var(--ink-color) 75%, transparent) 85%,
        var(--ink-color) 100%
      );
      z-index: 4;
    }
    /* Nueva barra horizontal con gradiente morado */
    .horizontal-line-purple {
      position: fixed;
      bottom: 5vh;
      left: 0;
      width: calc(100% - 80px);
      height: 1px;
      background: linear-gradient(to right, 
        rgba(128, 0, 255, 1) 0%,
        rgba(128, 0, 255, 0.1) 18%,
        rgba(128, 0, 255, 0) 25%
      );
      z-index: 4;
    }
    /* Franja vertical negra */
    .vertical-stripe {
      position: fixed;
      top: 0;
      right: 0;
      width: 80px;
      height: 100vh;
      background-color: var(--ink-color);
      z-index: 5;
      transition: background-color 0.16s ease;
    }
    .color-cross {
      position: fixed;
      top: 14px;
      right: 23px;
      width: 34px;
      height: 34px;
      padding: 0;
      border: 0;
      background:
        linear-gradient(rgba(255, 239, 225, 0.72), rgba(255, 239, 225, 0.72)) 5px 5px / 24px 24px no-repeat,
        linear-gradient(rgba(253, 197, 178, 0.78), rgba(253, 197, 178, 0.78)) 10px 8px / 12px 8px no-repeat,
        linear-gradient(rgba(238, 132, 119, 0.76), rgba(238, 132, 119, 0.76)) 14px 8px / 12px 12px no-repeat,
        linear-gradient(rgba(178, 59, 85, 0.82), rgba(178, 59, 85, 0.82)) 12px 14px / 14px 12px no-repeat,
        linear-gradient(rgba(222, 93, 111, 0.58), rgba(222, 93, 111, 0.58)) 8px 20px / 13px 8px no-repeat,
        linear-gradient(rgba(250, 166, 143, 0.52), rgba(250, 166, 143, 0.52)) 19px 21px / 8px 7px no-repeat;
      cursor: pointer;
      opacity: 0.7;
      z-index: 20;
      image-rendering: pixelated;
      box-shadow: 0 0 0 1px rgba(255, 240, 230, 0.18);
      transition: opacity 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
    }
    .color-cross::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(255, 230, 214, 0.46), rgba(255, 230, 214, 0.46)) 4px 10px / 6px 17px no-repeat,
        linear-gradient(rgba(255, 230, 214, 0.4), rgba(255, 230, 214, 0.4)) 10px 4px / 16px 6px no-repeat,
        linear-gradient(rgba(255, 230, 214, 0.36), rgba(255, 230, 214, 0.36)) 26px 10px / 4px 18px no-repeat,
        linear-gradient(rgba(255, 230, 214, 0.28), rgba(255, 230, 214, 0.28)) 10px 28px / 14px 3px no-repeat;
      pointer-events: none;
    }
    .color-cross:hover,
    .color-cross:focus-visible {
      opacity: 0.94;
      transform: scale(1.08);
      box-shadow: 0 0 0 1px rgba(255, 240, 230, 0.34);
      outline: none;
    }
    .color-panel {
      position: fixed;
      top: 44px;
      right: 18px;
      display: none;
      grid-template-columns: 128px 14px;
      gap: 8px;
      padding: 8px;
      background: color-mix(in srgb, var(--paper-color) 86%, transparent);
      border: 1px solid color-mix(in srgb, var(--ink-color) 30%, transparent);
      z-index: 21;
      backdrop-filter: blur(8px);
    }
    .color-panel.is-open {
      display: grid;
    }
    .color-field,
    .hue-field {
      display: block;
      cursor: crosshair;
      image-rendering: pixelated;
      touch-action: none;
    }
    .color-field {
      width: 128px;
      height: 96px;
    }
    .hue-field {
      width: 14px;
      height: 96px;
      cursor: ns-resize;
    }
    /* Cada elemento con posición absoluta */
    .item {
      position: absolute;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .item:hover {
      transform: var(--hover-transform, scale(1.08));
      filter: brightness(1.15);
      z-index: 10;
    }
    .item a {
      display: inline-block;
      text-decoration: none;
      position: relative;
      pointer-events: none;
    }
    .item img {
      display: block;
      max-width: 100%;
      height: auto;
      pointer-events: none;
    }
    .hit-area {
      position: absolute;
      display: block;
      border-radius: 999px;
      cursor: pointer;
      pointer-events: auto;
    }
    .item-portfolio .hit-area {
      top: -35%;
      left: -4%;
      width: 108%;
      height: 170%;
    }
    .item-onirc .hit-area {
      top: -25%;
      left: -25%;
      width: 150%;
      height: 150%;
    }
    .item-digital-walk .hit-area {
      top: 7%;
      left: 10%;
      width: 78%;
      height: 78%;
    }
    .item-casa .hit-area {
      top: 4%;
      left: 4%;
      width: 92%;
      height: 92%;
    }
    .item-research .hit-area {
      top: 7%;
      left: 2%;
      width: 82%;
      height: 82%;
    }
    .item-paragraph .hit-area {
      top: -45%;
      left: -55%;
      width: 210%;
      height: 210%;
    }
    .item-merch .hit-area {
      top: 8%;
      left: 14%;
      width: 72%;
      height: 76%;
    }
    .item-coleccionables .hit-area {
      top: -30%;
      left: -6%;
      width: 112%;
      height: 160%;
    }
    .item-twitter .hit-area {
      top: -55%;
      left: -8%;
      width: 116%;
      height: 210%;
    }

    /* Ajuste específico para Casa Nuestra */
    .item-casa img {
      filter: contrast(1.2) brightness(1.1);
    }
    .item-casa:hover img {
      filter: contrast(1.2) brightness(1.25);
    }

    .item-paragraph img {
      filter: invert(52%) sepia(54%) saturate(1021%) hue-rotate(321deg) brightness(103%) contrast(94%);
      opacity: 0.5;
    }
    body.palette-active .item-paragraph img {
      filter: none;
    }

    .item-ghost {
      opacity: 0.34;
      pointer-events: none;
      z-index: 1;
    }

    /* Posiciones y tamaños específicos para cada elemento */
    .item-portfolio {
      top: 8vh;
      left: 12vw;
      width: 22vw;
      --hover-transform: rotate(-2deg) scale(1.08);
      transform: rotate(-2deg);
    }
    .item-digital-walk {
      top: 12vh;
      right: 18vw;
      width: 28vw;
      --hover-transform: rotate(1deg) scale(1.08);
      transform: rotate(1deg);
    }
    .item-casa {
      top: 38vh;
      left: 23vw;
      width: 24vw;
      --hover-transform: rotate(-1deg) scale(1.08);
      transform: rotate(-1deg);
    }
    .item-research {
      bottom: 18vh;
      left: 13vw;
      width: 20vw;
      --hover-transform: rotate(2deg) scale(1.08);
      transform: rotate(2deg);
    }
    .item-merch {
      top: 45vh;
      right: 22vw;
      width: 26vw;
      --hover-transform: rotate(-1.5deg) scale(1.08);
      transform: rotate(-1.5deg);
    }
    .item-coleccionables {
      bottom: 12vh;
      right: 28vw;
      width: 22vw;
      --hover-transform: rotate(1.5deg) scale(1.08);
      transform: rotate(1.5deg);
    }
    .item-twitter {
      top: 32vh;
      left: 42vw;
      width: 16vw;
      z-index: 2;
      --hover-transform: rotate(-1deg) scale(1.08);
      transform: rotate(-1deg);
    }
    .item-onirc {
      top: 25vh;
      left: 8vw;
      width: 2vw;
      --hover-transform: rotate(-4deg) scale(1.08);
      transform: rotate(-4deg);
    }
    .item-paragraph {
      bottom: 18vh;
      left: 17vw;
      width: 3.25vw;
      z-index: 3;
      --hover-transform: rotate(-5deg) scale(1.08);
      transform: rotate(-5deg);
    }
    .item-ghost {
      top: 31vh;
      left: 42.5vw;
      width: 2.4vw;
      transform: rotate(4deg);
    }

    /* Media query para ajustar tamaños en pantallas más pequeñas */
    @media (max-width: 1024px) {
      .item {
        width: 30vw !important;
      }
      .item-ghost {
        width: 4vw !important;
        left: 40vw;
      }
      .vertical-stripe {
        width: 40px;
      }
      .horizontal-line, .horizontal-line-purple {
        width: calc(100% - 40px);
      }
    }

    @media (max-width: 640px) {
      .container {
        height: 100dvh;
      }
      .item-portfolio {
        top: 7vh;
        left: 9vw;
      }
      .item-digital-walk {
        top: 14vh;
        right: 16vw;
      }
      .item-onirc {
        top: 25vh;
        left: 8vw;
        width: 5vw !important;
      }
      .item-twitter {
        top: 34vh;
        left: 36vw;
      }
      .item-ghost {
        top: 34vh;
        left: 38vw;
      }
      .item-casa {
        top: 45vh;
        left: 9vw;
      }
      .item-merch {
        top: 49vh;
        right: 9vw;
      }
      .item-research {
        bottom: 21vh;
        left: 8vw;
      }
      .item-paragraph {
        bottom: 21vh;
        left: 14vw;
        width: 6vw !important;
      }
      .item-coleccionables {
        bottom: 10vh;
        right: 20vw;
      }
    }

    /* Estilos para el botón circular */
    .circle-button {
      position: fixed;
      bottom: 5px;
      right: 5px;
      width: 11px;
      height: 11px;
      background-color: transparent;
      color: #000000;
      border: none;
      border-radius: 50%;
      font-size: 7px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      transition: transform 0.3s ease;
      z-index: 6;
      opacity: 0.58;
    }

    .circle-button:hover {
      transform: scale(1.1);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="vertical-stripe"></div>
  <div class="horizontal-line"></div>
  <div class="horizontal-line-purple"></div>
  <button class="color-cross" type="button" aria-label="Cambiar color de fondo" aria-expanded="false"></button>
  <div class="color-panel" aria-label="Selector de color de fondo">
    <canvas class="color-field" width="128" height="96"></canvas>
    <canvas class="hue-field" width="14" height="96"></canvas>
  </div>
  <a href="nft.html" class="circle-button">⭕</a>
  <div class="container">
    <!-- Portafolio -->
    <div class="item item-portfolio">
      <a href="https://www.behance.net/ricardo-arias" target="_blank">
        <img src="portafolio.png" alt="Portafolio">
        <span class="hit-area" aria-hidden="true"></span>
      </a>
    </div>
    <!-- ONIRC -->
    <div class="item item-onirc">
      <a href="https://pocsi2.github.io/ONIRC/" target="_blank">
        <img src="onirc-dialogue.svg" alt="ONIRC">
        <span class="hit-area" aria-hidden="true"></span>
      </a>
    </div>
    <!-- Digital Walk Gal -->
    <div class="item item-digital-walk">
      <a href="https://oncyber.io/spaces/XoXl6QGJA623Skh2rMCJ" target="_blank">
        <img src="Digital Walk Gal.png" alt="Digital Walk Gal">
        <span class="hit-area" aria-hidden="true"></span>
      </a>
    </div>
    <!-- Casa Nuestra (Digital Gal) -->
    <div class="item item-casa">
      <a href="https://oncyber.io/spaces/Dwi13vknf2a2yQGBwohi" target="_blank">
        <img src="Casa nuestra (Digital Gal).png" alt="Casa Nuestra - Digital Gal">
        <span class="hit-area" aria-hidden="true"></span>
      </a>
    </div>
    <!-- Research Blog -->
    <div class="item item-research">
      <a href="https://reportevy.substack.com/" target="_blank">
        <img src="Research blog.png" alt="Research Blog">
        <span class="hit-area" aria-hidden="true"></span>
      </a>
    </div>
    <!-- Paragraph -->
    <div class="item item-paragraph">
      <a href="https://paragraph.com/@arias.ricardo.p" target="_blank">
        <img src="Research blog.png" alt="Paragraph">
        <span class="hit-area" aria-hidden="true"></span>
      </a>
    </div>
    <!-- Merch Stand -->
    <div class="item item-merch">
      <a href="https://radswag.printify.me/product/17581723" target="_blank">
        <img src="Merch Stand.png" alt="Merch Stand">
        <span class="hit-area" aria-hidden="true"></span>
      </a>
    </div>
    <!-- Coleccionables -->
    <div class="item item-coleccionables">
      <a href="https://opensea.io/atrptra" target="_blank">
        <img src="Colleccionables.png" alt="Coleccionables">
        <span class="hit-area" aria-hidden="true"></span>
      </a>
    </div>
    <!-- Twitter -->
    <div class="item item-twitter">
      <a href="https://x.com/richiye" target="_blank">
        <img src="x.png" alt="Twitter">
        <span class="hit-area" aria-hidden="true"></span>
      </a>
    </div>
    <!-- Ghost -->
    <div class="item item-ghost">
      <img src="ghost-pencil.svg" alt="">
    </div>
  </div>
  <script>
    const colorCross = document.querySelector('.color-cross');
    const colorPanel = document.querySelector('.color-panel');
    const colorField = document.querySelector('.color-field');
    const hueField = document.querySelector('.hue-field');
    const colorContext = colorField.getContext('2d');
    const hueContext = hueField.getContext('2d');
    const artworkImages = [...document.querySelectorAll('.item img')];
    const hitAreas = [...document.querySelectorAll('.hit-area')];
    const originalSources = new Map(artworkImages.map((image) => [image, image.currentSrc || image.getAttribute('src')]));
    const imageMasks = new Map();
    let hue = 0;
    let saturation = 0;
    let value = 1;
    let tintFrame = 0;
    let activeInk = { r: 17, g: 17, b: 17 };

    function hexToRgb(hex) {
      const value = hex.replace('#', '');
      return {
        r: parseInt(value.slice(0, 2), 16),
        g: parseInt(value.slice(2, 4), 16),
        b: parseInt(value.slice(4, 6), 16)
      };
    }

    function getLuminance({ r, g, b }) {
      const normalize = (channel) => {
        const value = channel / 255;
        return value <= 0.03928 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
      };
      return 0.2126 * normalize(r) + 0.7152 * normalize(g) + 0.0722 * normalize(b);
    }

    function getContrastInk(color) {
      return getLuminance(color) > 0.42 ? { r: 17, g: 17, b: 17 } : { r: 246, g: 246, b: 240 };
    }

    function colorToCss({ r, g, b }) {
      return `rgb(${r}, ${g}, ${b})`;
    }

    function rgbToHex({ r, g, b }) {
      return `#${[r, g, b].map((channel) => channel.toString(16).padStart(2, '0')).join('')}`;
    }

    function hsvToRgb(h, s, v) {
      const chroma = v * s;
      const segment = h / 60;
      const x = chroma * (1 - Math.abs((segment % 2) - 1));
      const m = v - chroma;
      let red = 0;
      let green = 0;
      let blue = 0;

      if (segment < 1) [red, green, blue] = [chroma, x, 0];
      else if (segment < 2) [red, green, blue] = [x, chroma, 0];
      else if (segment < 3) [red, green, blue] = [0, chroma, x];
      else if (segment < 4) [red, green, blue] = [0, x, chroma];
      else if (segment < 5) [red, green, blue] = [x, 0, chroma];
      else [red, green, blue] = [chroma, 0, x];

      return {
        r: Math.round((red + m) * 255),
        g: Math.round((green + m) * 255),
        b: Math.round((blue + m) * 255)
      };
    }

    function drawHueField() {
      for (let y = 0; y < hueField.height; y += 1) {
        hueContext.fillStyle = colorToCss(hsvToRgb((y / hueField.height) * 360, 1, 1));
        hueContext.fillRect(0, y, hueField.width, 1);
      }
    }

    function drawColorField() {
      const base = hsvToRgb(hue, 1, 1);
      colorContext.clearRect(0, 0, colorField.width, colorField.height);

      const saturationGradient = colorContext.createLinearGradient(0, 0, colorField.width, 0);
      saturationGradient.addColorStop(0, '#ffffff');
      saturationGradient.addColorStop(1, colorToCss(base));
      colorContext.fillStyle = saturationGradient;
      colorContext.fillRect(0, 0, colorField.width, colorField.height);

      const valueGradient = colorContext.createLinearGradient(0, 0, 0, colorField.height);
      valueGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
      valueGradient.addColorStop(1, '#000000');
      colorContext.fillStyle = valueGradient;
      colorContext.fillRect(0, 0, colorField.width, colorField.height);
    }

    async function createImageMask(image) {
      if (imageMasks.has(image)) return imageMasks.get(image);

      const source = new Image();
      source.decoding = 'async';
      source.src = originalSources.get(image);
      await source.decode();

      const canvas = document.createElement('canvas');
      canvas.width = source.naturalWidth;
      canvas.height = source.naturalHeight;

      const context = canvas.getContext('2d');
      context.drawImage(source, 0, 0);

      const frame = context.getImageData(0, 0, canvas.width, canvas.height);
      const pixels = frame.data;
      const mask = new Uint8ClampedArray(canvas.width * canvas.height);

      for (let index = 0; index < pixels.length; index += 4) {
        const alpha = pixels[index + 3];
        const darkness = 1 - ((pixels[index] + pixels[index + 1] + pixels[index + 2]) / 765);
        mask[index / 4] = Math.round(alpha * Math.max(0, darkness));
      }

      const data = { canvas, context, mask, width: canvas.width, height: canvas.height };
      imageMasks.set(image, data);
      return data;
    }

    async function tintImage(image, ink) {
      const maskData = await createImageMask(image);
      const frame = maskData.context.createImageData(maskData.width, maskData.height);
      const pixels = frame.data;

      for (let pixel = 0; pixel < maskData.mask.length; pixel += 1) {
        const alpha = maskData.mask[pixel];
        if (alpha === 0) continue;

        const index = pixel * 4;
        pixels[index] = ink.r;
        pixels[index + 1] = ink.g;
        pixels[index + 2] = ink.b;
        pixels[index + 3] = alpha;
      }

      maskData.context.putImageData(frame, 0, 0);
      image.src = maskData.canvas.toDataURL('image/png');
    }

    function scheduleTint(ink) {
      activeInk = ink;
      cancelAnimationFrame(tintFrame);
      tintFrame = requestAnimationFrame(() => {
        artworkImages.forEach((image) => tintImage(image, activeInk));
      });
    }

    function applyPalette(color) {
      const backgroundColor = rgbToHex(color);
      const paper = hexToRgb(backgroundColor);
      const ink = getContrastInk(paper);

      document.body.classList.add('palette-active');
      document.body.style.setProperty('--paper-color', backgroundColor);
      document.body.style.setProperty('--ink-color', colorToCss(ink));
      scheduleTint(ink);
    }

    function pickFromColorField(event) {
      const rect = colorField.getBoundingClientRect();
      saturation = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      value = 1 - Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
      applyPalette(hsvToRgb(hue, saturation, value));
    }

    function pickFromHueField(event) {
      const rect = hueField.getBoundingClientRect();
      hue = Math.min(359, Math.max(0, ((event.clientY - rect.top) / rect.height) * 360));
      drawColorField();
      applyPalette(hsvToRgb(hue, saturation, value));
    }

    function bindDrag(canvas, handler) {
      canvas.addEventListener('pointerdown', (event) => {
        canvas.setPointerCapture(event.pointerId);
        handler(event);
      });
      canvas.addEventListener('pointermove', (event) => {
        if (event.buttons !== 1) return;
        handler(event);
      });
    }

    colorCross.addEventListener('click', () => {
      const isOpen = colorPanel.classList.toggle('is-open');
      colorCross.setAttribute('aria-expanded', String(isOpen));
    });
    bindDrag(colorField, pickFromColorField);
    bindDrag(hueField, pickFromHueField);
    hitAreas.forEach((hitArea) => {
      hitArea.addEventListener('click', (event) => {
        const link = hitArea.closest('a');
        event.preventDefault();

        if (link.target === '_blank') {
          window.open(link.href, '_blank', 'noopener');
        } else {
          window.location.href = link.href;
        }
      });
    });
    drawHueField();
    drawColorField();
  </script>
</body>
</html>
