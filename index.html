<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Espacio - Portfolio Minimal</title>
  <style>
    /* Estilos base */
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    /* Contenedor principal */
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      padding: 2vw;
      box-sizing: border-box;
    }
    /* Barra horizontal con gradiente */
    .horizontal-line {
      position: fixed;
      bottom: 5vh;
      left: 0;
      width: calc(100% - 80px);
      height: 1px;
      background: linear-gradient(to right, 
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0) 75%,
        rgba(0, 0, 0, 0.75) 85%,
        rgba(0, 0, 0, 1) 100%
      );
      z-index: 4;
    }
    /* Nueva barra horizontal con gradiente morado */
    .horizontal-line-purple {
      position: fixed;
      bottom: 5vh;
      left: 0;
      width: calc(100% - 80px);
      height: 1px;
      background: linear-gradient(to right, 
        rgba(128, 0, 255, 1) 0%,
        rgba(128, 0, 255, 0.1) 18%,
        rgba(128, 0, 255, 0) 25%
      );
      z-index: 4;
    }
    /* Franja vertical negra */
    .vertical-stripe {
      position: fixed;
      top: 0;
      right: 0;
      width: 80px;
      height: 100vh;
      background-color: #000000;
      z-index: 5;
    }
    /* Cada elemento con posición absoluta */
    .item {
      position: absolute;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .item:hover {
      transform: var(--hover-transform, scale(1.08));
      filter: brightness(1.15);
      z-index: 10;
    }
    .item a {
      display: block;
      text-decoration: none;
      position: relative;
    }
    .item img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    /* Ajuste específico para Casa Nuestra */
    .item-casa img {
      filter: contrast(1.2) brightness(1.1);
    }
    .item-casa:hover img {
      filter: contrast(1.2) brightness(1.25);
    }

    .item-paragraph img {
      filter: invert(52%) sepia(54%) saturate(1021%) hue-rotate(321deg) brightness(103%) contrast(94%);
    }

    .item-ghost {
      opacity: 0.34;
      pointer-events: none;
      z-index: 1;
    }

    /* Posiciones y tamaños específicos para cada elemento */
    .item-portfolio {
      top: 8vh;
      left: 12vw;
      width: 22vw;
      --hover-transform: rotate(-2deg) scale(1.08);
      transform: rotate(-2deg);
    }
    .item-digital-walk {
      top: 12vh;
      right: 18vw;
      width: 28vw;
      --hover-transform: rotate(1deg) scale(1.08);
      transform: rotate(1deg);
    }
    .item-casa {
      top: 38vh;
      left: 23vw;
      width: 24vw;
      --hover-transform: rotate(-1deg) scale(1.08);
      transform: rotate(-1deg);
    }
    .item-research {
      bottom: 18vh;
      left: 13vw;
      width: 20vw;
      --hover-transform: rotate(2deg) scale(1.08);
      transform: rotate(2deg);
    }
    .item-merch {
      top: 45vh;
      right: 22vw;
      width: 26vw;
      --hover-transform: rotate(-1.5deg) scale(1.08);
      transform: rotate(-1.5deg);
    }
    .item-coleccionables {
      bottom: 12vh;
      right: 28vw;
      width: 22vw;
      --hover-transform: rotate(1.5deg) scale(1.08);
      transform: rotate(1.5deg);
    }
    .item-twitter {
      top: 32vh;
      left: 42vw;
      width: 16vw;
      z-index: 2;
      --hover-transform: rotate(-1deg) scale(1.08);
      transform: rotate(-1deg);
    }
    .item-onirc {
      top: 25vh;
      left: 8vw;
      width: 2vw;
      --hover-transform: rotate(-4deg) scale(1.08);
      transform: rotate(-4deg);
    }
    .item-paragraph {
      bottom: 18vh;
      left: 17vw;
      width: 13vw;
      z-index: 3;
      --hover-transform: rotate(-5deg) scale(1.08);
      transform: rotate(-5deg);
    }
    .item-ghost {
      top: 31vh;
      left: 42.5vw;
      width: 2.4vw;
      transform: rotate(4deg);
    }

    /* Media query para ajustar tamaños en pantallas más pequeñas */
    @media (max-width: 1024px) {
      .item {
        width: 30vw !important;
      }
      .item-ghost {
        width: 4vw !important;
        left: 40vw;
      }
      .vertical-stripe {
        width: 40px;
      }
      .horizontal-line, .horizontal-line-purple {
        width: calc(100% - 40px);
      }
    }

    @media (max-width: 640px) {
      .container {
        height: 100dvh;
      }
      .item-portfolio {
        top: 7vh;
        left: 9vw;
      }
      .item-digital-walk {
        top: 14vh;
        right: 16vw;
      }
      .item-onirc {
        top: 25vh;
        left: 8vw;
        width: 5vw !important;
      }
      .item-twitter {
        top: 34vh;
        left: 36vw;
      }
      .item-ghost {
        top: 34vh;
        left: 38vw;
      }
      .item-casa {
        top: 45vh;
        left: 9vw;
      }
      .item-merch {
        top: 49vh;
        right: 9vw;
      }
      .item-research {
        bottom: 21vh;
        left: 8vw;
      }
      .item-paragraph {
        bottom: 21vh;
        left: 14vw;
        width: 24vw !important;
      }
      .item-coleccionables {
        bottom: 10vh;
        right: 20vw;
      }
    }

    /* Estilos para el botón circular */
    .circle-button {
      position: fixed;
      bottom: 5px;
      right: 5px;
      width: 11px;
      height: 11px;
      background-color: transparent;
      color: #000000;
      border: none;
      border-radius: 50%;
      font-size: 7px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      transition: transform 0.3s ease;
      z-index: 6;
      opacity: 0.58;
    }

    .circle-button:hover {
      transform: scale(1.1);
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="vertical-stripe"></div>
  <div class="horizontal-line"></div>
  <div class="horizontal-line-purple"></div>
  <a href="nft.html" class="circle-button">⭕</a>
  <div class="container">
    <!-- Portafolio -->
    <div class="item item-portfolio">
      <a href="https://www.behance.net/ricardo-arias" target="_blank">
        <img src="portafolio.png" alt="Portafolio">
      </a>
    </div>
    <!-- ONIRC -->
    <div class="item item-onirc">
      <a href="https://pocsi2.github.io/ONIRC/" target="_blank">
        <img src="onirc-dialogue.svg" alt="ONIRC">
      </a>
    </div>
    <!-- Digital Walk Gal -->
    <div class="item item-digital-walk">
      <a href="https://oncyber.io/spaces/XoXl6QGJA623Skh2rMCJ" target="_blank">
        <img src="Digital Walk Gal.png" alt="Digital Walk Gal">
      </a>
    </div>
    <!-- Casa Nuestra (Digital Gal) -->
    <div class="item item-casa">
      <a href="https://oncyber.io/spaces/Dwi13vknf2a2yQGBwohi" target="_blank">
        <img src="Casa nuestra (Digital Gal).png" alt="Casa Nuestra - Digital Gal">
      </a>
    </div>
    <!-- Research Blog -->
    <div class="item item-research">
      <a href="https://reportevy.substack.com/" target="_blank">
        <img src="Research blog.png" alt="Research Blog">
      </a>
    </div>
    <!-- Paragraph -->
    <div class="item item-paragraph">
      <a href="https://paragraph.com/@arias.ricardo.p" target="_blank">
        <img src="Research blog.png" alt="Paragraph">
      </a>
    </div>
    <!-- Merch Stand -->
    <div class="item item-merch">
      <a href="https://radswag.printify.me/product/17581723" target="_blank">
        <img src="Merch Stand.png" alt="Merch Stand">
      </a>
    </div>
    <!-- Coleccionables -->
    <div class="item item-coleccionables">
      <a href="https://opensea.io/atrptra" target="_blank">
        <img src="Colleccionables.png" alt="Coleccionables">
      </a>
    </div>
    <!-- Twitter -->
    <div class="item item-twitter">
      <a href="https://x.com/richiye" target="_blank">
        <img src="x.png" alt="Twitter">
      </a>
    </div>
    <!-- Ghost -->
    <div class="item item-ghost">
      <img src="ghost-pencil.svg" alt="">
    </div>
  </div>
</body>
</html>
