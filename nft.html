<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT View</title>

  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pocsi2.github.io/Reception/nft.html">
  <meta property="og:title" content="NFT View">
  <meta property="og:description" content="Interactive NFT display">
  <meta property="og:image" content="https://pocsi2.github.io/Reception/nft.gif">

  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://pocsi2.github.io/Reception/nft.html">
  <meta property="twitter:title" content="NFT View">
  <meta property="twitter:description" content="Interactive NFT display">
  <meta property="twitter:image" content="https://pocsi2.github.io/Reception/nft.gif">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #ffffff;
      overflow: hidden;
    }

    .nft-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .nft-image {
      max-width: 86vw;
      max-height: 86vh;
      object-fit: contain;
      transition: transform 0.1s ease-out;
    }
  </style>
</head>
<body>
  <main class="nft-container">
    <img src="nft.gif" alt="NFT" class="nft-image" id="nftImage">
  </main>

  <script>
    const image = document.getElementById('nftImage');
    let scale = 1;
    const zoomFactor = 0.1;

    window.addEventListener('wheel', (event) => {
      event.preventDefault();

      if (event.deltaY < 0) {
        scale = Math.min(scale + zoomFactor, 2);
      } else {
        scale = Math.max(scale - zoomFactor, 0.5);
      }

      image.style.transform = `scale(${scale})`;
    }, { passive: false });
  </script>
</body>
</html>
